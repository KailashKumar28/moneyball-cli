[package]
name = "moneyball-desktop"
description = "Moneyball for Mac: the Tauri 2 shell over moneyball-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "moneyball_desktop"

[[bin]]
name = "moneyball-desktop"
path = "src/main.rs"

[features]
# Test only: the WebdriverIO plugins that let e2e/ drive the real app over
# a loopback WebDriver port, and core's stand-in Meta base URL. Never on in
# a normal build (e2e/README.md).
e2e = [
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
    "moneyball-core/e2e",
]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
moneyball-core.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tauri-plugin-wdio = { version = "1.5", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

[lints]
workspace = true
